; Arborisis Mesh — one firmware for two LoRa networks, Reticulum and
; MeshCore, on every LoRa board MeshCore describes.
;
;   pio run -e arb_heltec_v3            one board
;   pio run                             every board (default_envs)
;   python3 tools/gen_envs.py           after tools/sync_meshcore.sh
;   pio test -e arb_native              the host tests (test/)
;
; The sections up to "Arborisis" are MeshCore's own (vendored with the
; tree, see MESHCORE_VERSION): the board files in variants/ extend them by
; name, so they keep MeshCore's names and meaning. Two changes, both marked
; ARB: the Crypto library is attermann's fork of rweather/Crypto (the same
; API plus the nRF52 SoftDevice RNG, which microReticulum needs), and the
; STM32 platform is pinned to the last release this MeshCore builds with.

[platformio]
extra_configs =
  variants/*/platformio.ini
  arborisis_envs.ini
  platformio.local.ini

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  ;jgromes/RadioLib @ ^7.7.1
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  ; ARB: attermann/Crypto instead of rweather/Crypto @ ^0.4.0 (superset)
  https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts = merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
extra_scripts = create-uf2.py
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.3
; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git   ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
; ARB: ststm32 20.0 (STM32duino 3.0, August 2026) breaks this MeshCore:
; RadioLib's HAL passes a uint32_t where the new core wants a PinMode, and
; ltoa() is no longer declared. 19.7.1 is the last release on STM32duino 2.x.
platform = platformio/ststm32@19.7.1
extra_scripts = post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit BMP085 Library @ ^1.2.4

; ─── Arborisis ────────────────────────────────────────────────────────────────
; What every Arborisis Mesh environment adds to the MeshCore repeater of its
; board (see arborisis_envs.ini, generated). app/ is the application:
; radio arbiter, MeshCore repeater, RNode host protocol, Reticulum transport.

[arborisis]
build_flags =
  -I app
  -D ARB_FIRMWARE=1
  -D ARB_VERSION='"0.1.0"'
  -D ADVERT_NAME='"Arborisis"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D RNS_USE_FS
  -D MSGPACK_USE_BOOST=OFF
build_src_filter =
  +<../app>
lib_deps =

; microReticulum and what it needs, for the families that run Reticulum on
; the board (the repository's own copy, shared with the relay firmware).
[arborisis_rns]
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  hideakitai/MsgPack @ ^0.4.2
  microReticulum=symlink://../lib/microReticulum

; Per MCU family. ARB_WITH_RNS turns on the Reticulum transport that runs on
; the board itself (microReticulum); without it the board is still a full
; RNode for a Reticulum host over USB. STM32WL parts (64 KB of RAM) run
; without it.
[arborisis_esp32]
build_flags =
  -D ARB_WITH_RNS=1
  -D ARB_WITH_BLE=1
  -D RNS_PERSIST_PATHS
build_unflags =
; Framework libraries app/ uses: PlatformIO's dependency finder does not
; look into ../app, so they are named here.
lib_deps =
  ${arborisis_rns.lib_deps}
  LittleFS
  FS
  BLE

[arborisis_nrf52]
; The nRF52840 application region is ~800 KB; MeshCore's repeater with its
; fifteen optional sensor drivers and microReticulum do not fit together.
; The sensor drivers go (GPS stays): a repeater's telemetry is its battery,
; its radio and its position. (-U for the two MeshCore tests with #ifdef.)
build_flags =
  -D ARB_WITH_RNS=1
  -D ARB_WITH_BLE=1
  -fexceptions
  ${arborisis_lean_sensors.build_flags}
build_unflags = -fno-exceptions
lib_deps =
  ${arborisis_rns.lib_deps}
  Adafruit_LittleFS
  InternalFileSystem

[arborisis_rp2040]
build_flags =
  -D ARB_WITH_RNS=1
  -D RNS_PERSIST_PATHS
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
  -fexceptions
build_unflags = -fno-exceptions
lib_deps =
  ${arborisis_rns.lib_deps}
  LittleFS
lib_ignore = BLE

[arborisis_stm32]
build_flags =
  -D ARB_WITH_RNS=0
build_unflags =
lib_deps =

[arborisis_lean_sensors]
build_flags =
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -UENV_INCLUDE_BME680
  -UENV_INCLUDE_BMP085

; Host tests: the parts of app/ that do not touch hardware, and the radio
; arbiter on stand-ins for RadioLib and the board (test/mocks).
[env:arb_native]
platform = native
test_framework = googletest
test_filter = test_arb_*
build_flags = -std=c++17 -I app -I test/mocks
build_src_filter = -<*>
lib_deps =
  google/googletest @ 1.17.0

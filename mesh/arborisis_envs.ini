extends = env:ThinkNode_M9_repeater_
custom_arb_family = esp32
custom_arb_variant = thinknode_m9
build_flags =
  ${env:ThinkNode_M9_repeater_.build_flags}
  ${arborisis.build_flags}
  ${arborisis_esp32.build_flags}
  -D FIRMWARE_VERSION='"v1.17.1-arb0.1.0"'
build_unflags = ${arborisis_esp32.build_unflags}
build_src_filter =
  ${env:ThinkNode_M9_repeater_.build_src_filter}
  -<../examples/simple_repeater>
  ${arborisis.build_src_filter}
lib_deps =
  ${env:ThinkNode_M9_repeater_.lib_deps}
  ${arborisis.lib_deps}
  ${arborisis_esp32.lib_deps}

